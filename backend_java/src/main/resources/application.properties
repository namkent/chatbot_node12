# ===================================================================
# Cấu hình Spring Boot Backend cho UrChatbot Widget (Tương đương server.js)
# ===================================================================

# Cổng dịch vụ (Khớp với PORT=3001 của frontend Vue)
server.port=${PORT:3001}

# Giới hạn kích thước tải lên (hỗ trợ ảnh lớn tới 25MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Cấu hình Upstream AI API (OpenAI Compatible: Groq, OpenRouter, OpenAI, v.v.)
chatbot.openai.api-url=${OPENAI_API_URL:https://api.groq.com/openai/v1/chat/completions}
chatbot.openai.api-key=${OPENAI_API_KEY:}
chatbot.openai.default-model=${OPENAI_MODEL:qwen/qwen3.8-27b}

# Cấu hình tham số sinh văn bản AI
chatbot.ai.temperature=${AI_TEMPERATURE:0.6}
chatbot.ai.max-tokens=${AI_MAX_TOKENS:8192}
chatbot.ai.top-p=${AI_TOP_P:0.95}

# Heartbeat interval (ms) cho SSE
chatbot.sse.heartbeat-interval-ms=${HEARTBEAT_INTERVAL_MS:15000}

# Cấu hình MinIO S3 Compatible Service
chatbot.minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
chatbot.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
chatbot.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
chatbot.minio.bucket=${MINIO_BUCKET:chatbot}
chatbot.minio.public-url=${MINIO_PUBLIC_URL:http://127.0.0.1:9000/chatbot}

# SSL Verification (true: kiểm tra nghiêm ngặt, false: bypass chứng chỉ)
chatbot.ssl.reject-unauthorized=${NODE_TLS_REJECT_UNAUTHORIZED:false}

# ===================================================================
# Cấu hình H2 Database & JPA (Lưu trữ file-based tại ./data/chatbotdb)
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/chatbotdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (Truy cập: http://localhost:3001/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Model Fallback danh sách ưu tiên khi gặp lỗi 429 / 503
chatbot.fallback-models=qwen/qwen3.8-27b,openai/gpt-oss-120b,llama-3.3-70b-versatile

# Logging
logging.level.root=INFO
logging.level.com.chatbot=DEBUG
